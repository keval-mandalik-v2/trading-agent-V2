# One long-lived job per trading day, which does its own 15-minute timing.
#
# Why not 24 scheduled runs: measured on this repository, GitHub fired 2 of 24 requested
# `schedule:` events per day. Run numbers were sequential, so the other 22 were never
# created -- no error, nothing cancelled, they are simply discarded. Scheduled events are
# best-effort and deprioritised, and :00/:15/:30/:45 are the most congested minutes on the
# platform. No amount of cron tuning fixes it.
#
# So the scheduler is used ONCE, only to start the job. All timing after that comes from
# scanner/watch.py sleeping to each candle boundary, which is exact. A late start costs
# the first candle or two instead of the whole session.
#
# Cost note: this job is alive ~5h15m per trading day, and GitHub bills wall-clock time
# including sleep. That is ~6,600 minutes/month, which is free ONLY because this
# repository is public. If it is ever made private, this workflow costs roughly $39/month
# -- switch back to short dispatched runs before doing that.
#
# Times are UTC. IST = UTC+05:30, so 04:50 UTC = 10:20 IST.
name: scan

on:
  schedule:
    # Exactly one event per trading day. Three were tried as insurance against GitHub
    # discarding the first, but a concurrency group admits only one pending run, so the
    # backups spent the whole session queued behind the live watcher and then either
    # cancelled each other or started after the close and exited. Three rows in the run
    # list, one of them marked failed, for no benefit.
    #
    # If this single event is ever dropped, start the watcher by hand: Actions -> scan ->
    # Run workflow. It picks up from whatever candle is current.
    - cron: "50 4 * * 1-5"     # 10:20 IST
  workflow_dispatch:
    inputs:
      until:
        description: "Stop after this IST time (HH:MM)"
        default: "15:46"
      once:
        description: "Single pass instead of watching the session"
        type: boolean
        default: false
      no_telegram:
        description: "Print alerts instead of sending them"
        type: boolean
        default: false

# A backup cron must never cancel the run that is already watching the session. It queues
# instead, starts after the close, sees the session is over and exits in seconds.
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # job ceiling is 360; the session needs ~315
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Watch the session
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m scanner.watch \
            --until "${{ inputs.until || '15:46' }}" \
            ${{ inputs.once && '--once' || '' }} \
            ${{ inputs.no_telegram && '--no-telegram' || '' }}
