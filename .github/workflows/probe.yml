# Run this manually FIRST. If it fails, the rest of this repo cannot run on
# GitHub-hosted runners and needs a self-hosted runner instead.
name: probe-nse-reachability

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/probe_reachability.py
